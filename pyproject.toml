[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sat-sa"
version = "1.0.0"
description = "Supervisory Analytics Tool for SOC Assessment (SAT-SA) — NCIIPC"
requires-python = ">=3.11"
authors = [
    {name = "SAT-SA Development Team"}
]
dependencies = [
    "duckdb==1.1.3",
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "pydantic==2.10.3",
    "cryptography==43.0.3",
    "numpy==2.1.3",
    "scipy==1.14.1",
    "ruptures==1.1.9",
    "datasketch==1.6.5",
    "pandas==2.2.3",
    "typer==0.13.1",
    "PyYAML==6.0.2",
    "python-dateutil==2.9.0",
    "reportlab==4.2.5",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "pytest-benchmark==5.1.0",
    "httpx==0.28.0",
]
build = [
    "pyinstaller==6.11.1",
]

[project.scripts]
satsa = "engine.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["engine*", "api*", "datagen*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
